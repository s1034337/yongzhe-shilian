<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>勇者試煉｜打怪 RPG 題庫練習</title>
  <style>
    :root{--ink:#30231b;--cream:#fff9e9;--gold:#edbd58;--blue:#426da5;--red:#c9524c;--green:#4d9b66}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:#1d3945 url("assets/backgrounds/forest-battle.png") center/cover fixed}.app{width:min(1100px,94vw);margin:auto;padding:16px 0 30px}.title{display:block;width:min(600px,86vw);margin:0 auto 2px}.hud{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 auto 10px;color:#fff}.badge{padding:8px 14px;border:2px solid #ffe9a4;border-radius:99px;background:#1f3445cc;font-weight:900}.screen{display:none}.screen.show{display:block}.panel{border:3px solid #8c623b;border-radius:20px;background:#fff9e9ed;box-shadow:0 10px 28px #10202a88;padding:clamp(14px,3vw,28px)}.arena{display:grid;grid-template-columns:1fr 64px 1fr;align-items:end;gap:10px;margin-bottom:14px}.fighter{text-align:center}.fighter img{height:clamp(140px,23vw,240px);max-width:100%;object-fit:contain;filter:drop-shadow(0 8px 4px #2a160755);transition:transform .2s}.fighter img.hit{transform:translateX(10px) rotate(4deg)}.name{font-size:1.25rem;font-weight:900}.vs{text-align:center;font-size:2rem;color:#9d382c;font-weight:900;padding-bottom:80px}.bar{height:19px;background:#d6c4a5;border:2px solid #765338;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b9b63,#a7dc69);transition:width .3s}.bar i.low{background:linear-gradient(90deg,#c63f42,#ef9063)}.hp{margin-top:4px;font-weight:900;font-size:.92rem}.questionbox{max-width:820px;margin:auto;padding:16px;border:2px solid #b99460;border-radius:15px;background:#fffdf5;text-align:center}.stage{color:#805c3d;font-weight:900}.question{margin:8px 0;font-size:clamp(1.2rem,3vw,1.7rem);font-weight:900;line-height:1.5}.question-image{display:block;width:auto;max-width:100%;max-height:46vh;margin:10px auto 0;border:1px solid #d7c7ac;border-radius:8px;background:#fff;object-fit:contain}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:820px;margin:14px auto 0}.answer,button{font:inherit;font-weight:900;cursor:pointer}.answer{min-height:58px;padding:9px;border:2px solid #9e774d;border-radius:12px;background:linear-gradient(#fff9e8,#efd08c);color:var(--ink);box-shadow:0 4px #b8884e;font-size:1.25rem}.answer:disabled{cursor:default}.answer.correct{background:#bfe7b9}.answer.wrong{background:#f3b4a8}.message{min-height:48px;margin:14px auto 0;max-width:820px;padding:12px;border-radius:12px;background:#f4e5c5;text-align:center;font-weight:900}.message.good{background:#d5edd0;color:#1f7144}.message.bad{background:#f8d6cf;color:#9b342d}.tools{display:flex;justify-content:center;gap:8px;margin-top:12px}.tool,.primary{border:0;border-radius:11px;padding:10px 16px;color:#fff;background:#426da5;box-shadow:0 4px #28486d}.tool{background:#8e526c}.tool:disabled,.buy:disabled{opacity:.45;cursor:default}.shop{background:#fdf4dfed url("assets/backgrounds/wood-shop.png") center/cover}.shop h2,.result h2{text-align:center;margin:0 0 8px;font-size:clamp(2rem,5vw,3rem);color:#633b29}.shop p{text-align:center;font-weight:700}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item{padding:14px;border:2px solid #9c754c;border-radius:15px;background:#fffaf0e8;text-align:center}.item img{height:85px;max-width:100%;object-fit:contain}.item h3{margin:4px}.buy{border:0;border-radius:9px;padding:9px 12px;background:#d58a39;color:#fff;box-shadow:0 3px #8f4d26}.inventory{text-align:center;margin:10px;color:#fff;font-weight:900;text-shadow:0 1px 3px #111}.result{text-align:center}.result .panel{max-width:600px;margin:auto}.loading{text-align:center;color:#fff;font-weight:900;padding:45px}.small{font-size:.9rem;color:#765f4e}@media(max-width:650px){.arena{grid-template-columns:1fr 34px 1fr}.vs{font-size:1.3rem;padding-bottom:65px}.fighter img{height:130px}.answers,.items{grid-template-columns:repeat(2,1fr)}.items{grid-template-columns:1fr;gap:9px}.item{display:grid;grid-template-columns:90px 1fr;align-items:center;text-align:left}.item img{grid-row:span 3}.item p{margin:3px 0;text-align:left}.app{width:min(96vw,1100px)}.question-image{max-height:none}}
    .subtitle{width:max-content;max-width:90vw;margin:-2px auto 12px;padding:7px 22px;border:2px solid #ffe8a0;border-radius:999px;background:#193442d9;color:#fff7d6;font-size:clamp(1rem,2.5vw,1.35rem);font-weight:900;letter-spacing:.12em;text-align:center;text-shadow:0 2px 4px #07171f;box-shadow:0 5px 14px #10202a66}
    .hud{flex-wrap:wrap}.question-image{cursor:zoom-in}.zoom-hint{margin:6px 0 0;color:#785c3f;font-size:.9rem;font-weight:900}.zoom-question{display:block;margin:10px auto 0;border:2px solid #84613f;border-radius:999px;padding:9px 18px;background:#fff0bd;color:#553923;box-shadow:0 3px #b98b4f}.zoom-question:hover,.zoom-question:focus-visible{background:#ffe28b;outline:3px solid #426da566}.image-modal{position:fixed;inset:0;z-index:1000;display:none;place-items:center;padding:16px;background:#07131be8}.image-modal.show{display:grid}.image-modal img{display:block;max-width:96vw;max-height:88vh;border:4px solid #fff7dc;border-radius:10px;background:#fff;box-shadow:0 16px 50px #000b;object-fit:contain}.modal-close{position:fixed;top:14px;right:16px;z-index:1001;border:2px solid #ffe7a0;border-radius:999px;padding:9px 15px;background:#233f4d;color:#fff;font-size:1rem;box-shadow:0 4px 12px #0008}.music-toggle{border:2px solid #cde6dd;border-radius:999px;padding:8px 14px;background:#173c45dd;color:#fff;box-shadow:0 3px 10px #07171f88}.music-toggle[aria-pressed="true"]{border-color:#ffe59a;background:#6a4d2ddd;color:#fff7d6}@media(max-width:650px){.hud{justify-content:center}.music-toggle{flex-basis:100%;max-width:190px}}
  </style>
</head>
<body><main class="app">
  <img class="title" src="assets/title-plaque-v2.png" alt="勇者試煉">
  <p class="subtitle">造字法則歷屆試題</p>
  <div class="hud"><span class="badge" id="stageHud">第 1 關</span><span class="badge">🪙 <span id="coins">0</span> 金幣</span><button class="music-toggle" id="musicToggle" type="button" aria-pressed="false">♫ 播放音樂</button></div>
  <section class="screen show loading" id="loading"><h2>正在整理勇者的題卷…</h2><p>準備進入奇幻森林！</p></section>
  <section class="screen" id="battle"><div class="inventory" id="inventory"></div><div class="panel"><div class="arena"><div class="fighter"><img id="wizard" src="assets/characters/wizard.png" alt="可愛魔法師"><div class="name">小魔法師</div><div class="bar"><i id="playerBar"></i></div><div class="hp" id="playerHp"></div></div><div class="vs">VS</div><div class="fighter"><img id="monster" alt="怪物"><div class="name" id="monsterName"></div><div class="bar"><i id="monsterBar"></i></div><div class="hp" id="monsterHp"></div></div></div><div class="questionbox"><div class="stage" id="stageText"></div><div class="question" id="question"></div><img class="question-image" id="questionImage" alt="造字法則題目圖片" tabindex="0" role="button" aria-label="點擊題目可以放大"><button class="zoom-question" id="zoomQuestionButton" type="button">🔍 點擊題目可以放大</button></div><div class="answers" id="answers"></div><div class="tools"><button class="tool" id="potion">使用回血藥水</button></div><div class="message" id="message"></div></div></section>
  <section class="screen shop" id="shop"><div class="panel"><h2>溫暖商店</h2><p id="shopInfo"></p><div class="items"><article class="item"><img src="assets/items/potion.png" alt="回血藥水"><h3>回血藥水</h3><p>立即回復 50 HP</p><button class="buy" data-item="potion">購買 30 金幣</button></article><article class="item"><img src="assets/items/crystal.png" alt="攻擊水晶"><h3>攻擊水晶</h3><p>下次答對造成 50 傷害</p><button class="buy" data-item="crystal">購買 40 金幣</button></article><article class="item"><img src="assets/items/charm.png" alt="復活符"><h3>復活符</h3><p>HP 歸零時復活為 1 HP</p><button class="buy" data-item="charm">購買 80 金幣</button></article></div><div class="tools"><button class="primary" id="next">挑戰下一關</button></div></div></section>
  <section class="screen result" id="result"><div class="panel"><h2 id="resultTitle"></h2><p id="resultText"></p><button class="primary" id="restart">重新挑戰</button></div></section>
</main><div class="image-modal" id="imageModal" role="dialog" aria-modal="true" aria-label="放大題目"><button class="modal-close" id="modalClose" type="button">關閉 ×</button><img id="modalImage" alt="放大的題目圖片"></div><script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQk8gSGEu5Q_ENYmN4ZkC3jiVY1NaJYiefhqapAYNZVaxyyL8GfebE2zfo1MZcxlHo0fpfO1wmUZGun/pub?output=csv';
const monsters=[['野狼','wolf-clean.png',25,16],['毒蠍','scorpion-clean.png',50,20],['惡鬼','demon-clean.png',50,24],['巨龍','dragon-clean.png',50,28],['魔王','demon-king-clean.png',50,32]];
const imageQuestions=[
  ['造字法則題目','A','B','C','D',1,'assets/questions/cropped/question-1.png?v=hd1'],
  ['造字法則題目','A','B','C','D',2,'assets/questions/cropped/question-2.png'],
  ['造字法則題目','A','B','C','D',3,'assets/questions/cropped/question-3.png'],
  ['造字法則題目','A','B','C','D',0,'assets/questions/cropped/question-4.png'],
  ['造字法則題目','A','B','C','D',0,'assets/questions/cropped/question-5.png'],
  ['造字法則題目','A','B','C','D',2,'assets/questions/cropped/question-6.png'],
  ['造字法則題目','A','B','C','D',3,'assets/questions/cropped/question-7.png'],
  ['造字法則題目','A','B','C','D',2,'assets/questions/cropped/question-8.png'],
  ['造字法則題目','A','B','C','D',2,'assets/questions/cropped/question-9.png']
];
let qs=[],stage=0,hp=100,mhp=0,coins=0,correct=0,bag=[],inv={potion:0,crystal:0,charm:0},locked=false;
const $=s=>document.querySelector(s);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('show',x.id===id))}function csv(t){let r=[],a=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){a.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;a.push(v);r.push(a);a=[];v=''}else v+=c}a.push(v);r.push(a);return r}
async function load(){qs=imageQuestions;start()}
function start(){stage=0;hp=100;coins=0;correct=0;inv={potion:0,crystal:0,charm:0};bag=[];startStage()}function startStage(){mhp=monsters[stage][2];locked=false;show('battle');nextQ();render();msg('答對即可施放魔法攻擊怪物！')}
function nextQ(){if(!bag.length)bag=[...qs].sort(()=>Math.random()-.5);let q=bag.pop();window.cur=q;$('#question').textContent='請觀察題圖並選出答案';$('#questionImage').src=q[6];let opts=q.slice(1,5).map((x,i)=>({x,i}));$('#answers').innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent='ABCD'[o.i];b.setAttribute('aria-label','選項 '+('ABCD'[o.i]));b.onclick=()=>answer(b,o.i);$('#answers').append(b)})}
function answer(b,i){if(locked)return;locked=true;document.querySelectorAll('.answer').forEach(x=>x.disabled=true);if(i===cur[5]){let d=inv.crystal?50:25;if(inv.crystal)inv.crystal--;mhp=Math.max(0,mhp-d);coins+=5;correct++;$('#monster').classList.add('hit');setTimeout(()=>$('#monster').classList.remove('hit'),250);msg('答對！魔法命中，造成 '+d+' 傷害，獲得 5 金幣。','good');render();setTimeout(()=>mhp?unlock():win(),900)}else{hp=Math.max(0,hp-monsters[stage][3]);b.classList.add('wrong');[...document.querySelectorAll('.answer')].find(x=>x.textContent.endsWith(cur[cur[5]+1]))?.classList.add('correct');msg('答錯了！正確答案是：'+cur[cur[5]+1]+'。你受到 '+monsters[stage][3]+' 傷害。','bad');render();setTimeout(()=>hp?unlock():dead(),1700)}}function unlock(){locked=false;nextQ();render()}function dead(){if(inv.charm){inv.charm--;hp=1;msg('復活符發亮了！你以 1 HP 復活。','good');unlock()}else{show('result');$('#resultTitle').textContent='本次挑戰暫停';$('#resultText').textContent='你在第 '+(stage+1)+' 關倒下了。休息一下，再重新挑戰吧！'}}function win(){coins+=25+stage*10;if(stage===4){show('result');$('#resultTitle').textContent='恭喜完成勇者試煉！';$('#resultText').textContent='答對 '+correct+' 題，最後帶著 '+coins+' 金幣完成五關挑戰！';return}show('shop');$('#shopInfo').textContent='打贏 '+monsters[stage][0]+'！目前有 '+coins+' 金幣，為下一戰做準備吧。';render()}function msg(t,c=''){$('#message').textContent=t;$('#message').className='message '+c}function render(){let m=monsters[stage];$('#stageHud').textContent='第 '+(stage+1)+' 關';$('#stageText').textContent='第 '+(stage+1)+' 關・挑戰 '+m[0];$('#coins').textContent=coins;$('#monster').src='assets/characters/'+m[1];$('#monster').alt=m[0];$('#monsterName').textContent=m[0];bar('#playerBar','#playerHp',hp,100);bar('#monsterBar','#monsterHp',mhp,m[2]);$('#inventory').textContent='背包：回血藥水 '+inv.potion+'　攻擊水晶 '+inv.crystal+'　復活符 '+inv.charm;$('#potion').disabled=locked||!inv.potion||hp===100;document.querySelectorAll('.buy').forEach(b=>b.disabled=coins<({potion:30,crystal:40,charm:80}[b.dataset.item]))}function bar(b,t,n,max){let x=$(b);x.style.width=n/max*100+'%';x.classList.toggle('low',n/max<=.3);$(t).textContent='HP '+n+' / '+max}
$('#potion').onclick=()=>{if(inv.potion&&hp<100&&!locked){inv.potion--;hp=Math.min(100,hp+50);msg('喝下回血藥水，回復 50 HP！','good');render()}};document.querySelectorAll('.buy').forEach(b=>b.onclick=()=>{let k=b.dataset.item,p={potion:30,crystal:40,charm:80}[k];if(coins>=p){coins-=p;inv[k]++;$('#shopInfo').textContent='已購買 '+({potion:'回血藥水',crystal:'攻擊水晶',charm:'復活符'}[k])+'！';render()}});$('#next').onclick=()=>{stage++;hp=Math.min(100,hp+20);startStage()};$('#restart').onclick=start;
const imageModal=$('#imageModal'),modalImage=$('#modalImage');
function openQuestionImage(){modalImage.src=$('#questionImage').src;imageModal.classList.add('show');document.body.style.overflow='hidden';$('#modalClose').focus()}
function closeQuestionImage(){imageModal.classList.remove('show');document.body.style.overflow='';modalImage.removeAttribute('src')}
$('#questionImage').onclick=openQuestionImage;$('#questionImage').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openQuestionImage()}};$('#zoomQuestionButton').onclick=openQuestionImage;$('#modalClose').onclick=closeQuestionImage;imageModal.onclick=e=>{if(e.target===imageModal)closeQuestionImage()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeQuestionImage()});
let musicContext,musicTimer,musicStep=0,musicPlaying=false;
const melody=[261.63,329.63,392,493.88,440,392,329.63,293.66,349.23,440,523.25,440,392,329.63,293.66,246.94];
function musicNote(){if(!musicPlaying||!musicContext)return;let now=musicContext.currentTime,osc=musicContext.createOscillator(),gain=musicContext.createGain();osc.type='triangle';osc.frequency.value=melody[musicStep%melody.length];gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.035,now+.04);gain.gain.exponentialRampToValueAtTime(.0001,now+.55);osc.connect(gain).connect(musicContext.destination);osc.start(now);osc.stop(now+.6);if(musicStep%4===0){let bass=musicContext.createOscillator(),bassGain=musicContext.createGain();bass.type='sine';bass.frequency.value=musicStep%8===0?130.81:196; bassGain.gain.setValueAtTime(.0001,now);bassGain.gain.exponentialRampToValueAtTime(.018,now+.05);bassGain.gain.exponentialRampToValueAtTime(.0001,now+.75);bass.connect(bassGain).connect(musicContext.destination);bass.start(now);bass.stop(now+.8)}musicStep++}
async function toggleMusic(){if(!musicContext)musicContext=new (window.AudioContext||window.webkitAudioContext)();if(musicContext.state==='suspended')await musicContext.resume();musicPlaying=!musicPlaying;let button=$('#musicToggle');button.setAttribute('aria-pressed',String(musicPlaying));button.textContent=musicPlaying?'♫ 音樂播放中':'♫ 播放音樂';if(musicPlaying){musicNote();musicTimer=setInterval(musicNote,620)}else clearInterval(musicTimer)}
$('#musicToggle').onclick=toggleMusic;document.addEventListener('visibilitychange',()=>{if(document.hidden&&musicPlaying)toggleMusic()});load();
</script></body></html>
